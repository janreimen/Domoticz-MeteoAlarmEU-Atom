name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile plugin.py meteo.py fakeDomoticz.py

      # testManifest.py (plugin manifest + icon zip), testMeteo.py (parser),
      # testPlugin.py (onStart/onHeartbeat end to end)
      - name: Run tests
        run: python -m unittest discover -p 'test*.py' -v
